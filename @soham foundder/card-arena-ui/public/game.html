<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Arena - In Game</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Full Screen Game Layout */
    body {
      overflow: hidden;
    }
    .game-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .game-header {
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 12, 0.9);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      z-index: 10;
    }
    .score-board {
      display: flex;
      gap: 30px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .team-score {
      text-align: center;
    }
    .team-score .label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .team-score .points {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Cinzel', serif;
    }
    .team-1-points { color: #3498db; }
    .team-2-points { color: #e74c3c; }
    
    /* Game Board */
    .game-board {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #0a4f35 0%, #021a11 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }
    
    /* Center Play Area */
    .center-play-area {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.3);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .played-card {
      position: absolute;
      width: 70px;
      height: 100px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      animation: cardDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
    }
    .card-red { color: #e74c3c; }
    .card-black { color: #2c3e50; }
    
    .played-top { top: 20px; left: 50%; transform: translateX(-50%) rotate(180deg); }
    .played-left { left: 20px; top: 50%; transform: translateY(-50%) rotate(90deg); }
    .played-right { right: 20px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
    .played-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }

    /* Player HUDs */
    .game-player {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }
    .game-player.top { top: 20px; left: 50%; transform: translateX(-50%); }
    .game-player.bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
    .game-player.left { left: 20px; top: 50%; transform: translateY(-50%); }
    .game-player.right { right: 20px; top: 50%; transform: translateY(-50%); }
    
    .player-info-pill {
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 5px 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(5px);
    }
    .player-info-pill.active-turn {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      animation: pulseGold 2s infinite;
    }
    
    .avatar-sm {
      width: 30px; height: 30px;
      background: #333; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      border: 1px solid var(--gold-primary);
    }

    /* Cards in Hand */
    .hand {
      display: flex;
      gap: -20px; /* Overlap */
      margin-top: 10px;
    }
    .card-back {
      width: 50px; height: 75px;
      background: linear-gradient(135deg, #8b0000, #300000);
      border: 2px solid white;
      border-radius: 4px;
      margin-left: -20px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.3);
    }
    .card-back:first-child { margin-left: 0; }
    
    /* My Hand (Bottom) */
    .my-hand {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      perspective: 1000px;
    }
    .my-card {
      width: 80px; height: 120px;
      background: white;
      border-radius: 8px;
      margin-left: -30px;
      box-shadow: -5px 5px 15px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
    }
    .my-card:first-child { margin-left: 0; }
    .my-card:hover {
      transform: translateY(-20px) scale(1.1);
      z-index: 10;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }
    
    .card-corner {
      font-size: 16px;
      line-height: 1;
      position: absolute;
    }
    .card-corner.top-left { top: 5px; left: 5px; }
    .card-corner.bottom-right { bottom: 5px; right: 5px; transform: rotate(180deg); }
    
    .card-center {
      font-size: 36px;
      flex: 1;
      display: flex;
      align-items: center;
    }

    @keyframes cardDrop {
      0% { opacity: 0; transform: scale(1.5) translate(0, -50px); }
      100% { opacity: 1; transform: scale(1) translate(0, 0); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- Top Header / Scoreboard -->
    <header class="game-header">
      <div class="text-gold" style="font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold;">
        28 POINT
      </div>
      
      <div class="score-board">
        <div class="team-score">
          <div class="label">TEAM 1 (YOU)</div>
          <div class="points team-1-points">0</div>
        </div>
        <div class="text-muted" style="font-size: 24px;">-</div>
        <div class="team-score">
          <div class="label">TEAM 2</div>
          <div class="points team-2-points">0</div>
        </div>
      </div>
      
      <div>
        <button class="btn-outline" style="padding: 5px 15px; font-size: 12px;">Menu</button>
      </div>
    </header>

    <!-- Game Board -->
    <main class="game-board">
      
      <!-- Center Play Area -->
      <div class="center-play-area">
        <div class="text-muted" style="position: absolute; font-size: 12px; letter-spacing: 2px;">TABLE</div>
        
        <!-- Animated Cards Dropping (Simulating Game Start/Play) -->
        <div class="played-card card-black played-top" style="animation-delay: 0.5s;">
          <div style="font-size: 12px; position: absolute; top: 5px; left: 5px;">J ♠</div>
          <div style="font-size: 24px;">♠</div>
        </div>
        
        <div class="played-card card-red played-left" style="animation-delay: 1.2s;">
          <div style="font-size: 12px; position: absolute; top: 5px; left: 5px;">9 ♥</div>
          <div style="font-size: 24px;">♥</div>
        </div>
      </div>

      <!-- Player 2 (Top) -->
      <div class="game-player top">
        <div class="player-info-pill">
          <div class="avatar-sm">👨‍🦳</div>
          <div style="font-size: 12px; font-weight: bold;">Player 2</div>
        </div>
        <div class="hand">
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
        </div>
      </div>

      <!-- Player 3 (Left) -->
      <div class="game-player left">
        <div class="player-info-pill">
          <div class="avatar-sm">👩</div>
          <div style="font-size: 12px; font-weight: bold;">Player 3</div>
        </div>
        <div class="hand" style="flex-direction: column; gap: -50px; transform: rotate(90deg);">
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
        </div>
      </div>

      <!-- Player 4 (Right) -->
      <div class="game-player right">
        <div class="player-info-pill active-turn">
          <div class="avatar-sm">🤖</div>
          <div style="font-size: 12px; font-weight: bold;">AI Bot</div>
          <div style="font-size: 10px; color: var(--gold-light);">Thinking...</div>
        </div>
        <div class="hand" style="flex-direction: column; gap: -50px; transform: rotate(-90deg);">
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
          <div class="card-back"></div>
        </div>
      </div>

      <!-- Player 1 (Bottom - YOU) -->
      <div class="game-player bottom" style="bottom: 40px;">
        <div class="player-info-pill">
          <div class="avatar-sm">👑</div>
          <div class="text-gold" style="font-size: 14px; font-weight: bold;">YOU</div>
        </div>
        
        <div class="my-hand">
          <div class="my-card card-black">
            <div class="card-corner top-left">A<br>♠</div>
            <div class="card-center">♠</div>
            <div class="card-corner bottom-right">A<br>♠</div>
          </div>
          <div class="my-card card-red">
            <div class="card-corner top-left">10<br>♥</div>
            <div class="card-center">♥</div>
            <div class="card-corner bottom-right">10<br>♥</div>
          </div>
          <div class="my-card card-red">
            <div class="card-corner top-left">K<br>♦</div>
            <div class="card-center">♦</div>
            <div class="card-corner bottom-right">K<br>♦</div>
          </div>
          <div class="my-card card-black">
            <div class="card-corner top-left">Q<br>♣</div>
            <div class="card-center">♣</div>
            <div class="card-corner bottom-right">Q<br>♣</div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Simple logic to simulate AI playing a card after a few seconds
    setTimeout(() => {
      const rightPlayer = document.querySelector('.game-player.right .player-info-pill');
      rightPlayer.classList.remove('active-turn');
      rightPlayer.querySelector('div:last-child').innerText = ''; // clear thinking text
      
      const playArea = document.querySelector('.center-play-area');
      const aiCard = document.createElement('div');
      aiCard.className = 'played-card card-black played-right';
      aiCard.innerHTML = '<div style="font-size: 12px; position: absolute; top: 5px; left: 5px;">A ♣</div><div style="font-size: 24px;">♣</div>';
      playArea.appendChild(aiCard);
      
      // Make it YOUR turn
      setTimeout(() => {
        const myPlayer = document.querySelector('.game-player.bottom .player-info-pill');
        myPlayer.classList.add('active-turn');
        
        const myTurnText = document.createElement('div');
        myTurnText.style.cssText = 'font-size: 10px; color: var(--gold-light); position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-weight: bold; animation: pulseGold 1s infinite;';
        myTurnText.innerText = 'YOUR TURN';
        myPlayer.style.position = 'relative';
        myPlayer.appendChild(myTurnText);
      }, 500);

    }, 3000);
  </script>
</body>
</html>
