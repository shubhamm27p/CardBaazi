<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Card Arena</title>
    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/login.css">
    <style>
        /* Specific styles for the admin login form */
        .admin-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
            width: 100%;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .form-group input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background-color: #f8fafc;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--accent-primary);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
        }
        #error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Immersive Background Animation -->
    <div class="background-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- Playing Card Login Container -->
    <div class="login-container playing-card">
        <!-- Top left index -->
        <div class="card-index top-left">
            <span class="rank">A</span>
            <span class="suit">&spades;</span>
        </div>
        
        <!-- Bottom right index -->
        <div class="card-index bottom-right">
            <span class="rank">A</span>
            <span class="suit">&spades;</span>
        </div>

        <div class="card-inner-border">
            <div class="logo-wrapper">
                <h1 class="logo-text">CARD <span>ARENA</span></h1>
                <p class="subtitle">Admin Portal Login</p>
            </div>
            
            <form id="admin-login-form" class="admin-form">
                <div class="form-group">
                    <label for="admin-user">Admin Username</label>
                    <input type="text" id="admin-user" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="admin-pass">Password</label>
                    <input type="password" id="admin-pass" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-submit">LOGIN TO DASHBOARD</button>
                <div id="error-msg">Invalid credentials. Please try again.</div>
            </form>
        </div>
    </div>

    <script src="js/admin-auth.js"></script>
    <script>
        // Interactive 3D Card Tilt Effect
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.login-container.playing-card');
            
            // Only apply tilt after entrance animation finishes
            setTimeout(() => {
                document.addEventListener('mousemove', (e) => {
                    if (!card) return;
                    
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                    
                    card.style.transform = `perspective(2000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });

                // Reset on mouse leave window
                document.addEventListener('mouseleave', () => {
                    if(card) card.style.transform = `perspective(2000px) rotateY(0deg) rotateX(0deg)`;
                });
            }, 1500);
        });
    </script>
</body>
</html>
